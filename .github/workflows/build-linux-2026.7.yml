name: build-linux-2026.7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout client (tag 2026.7)
        uses: actions/checkout@v4
        with:
          repository: msameerm/mullvadvpn-app
          ref: 2026.7
          submodules: recursive
          fetch-depth: 0
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo apt-get -y --no-install-recommends install \
            build-essential pkg-config curl git ca-certificates \
            libdbus-1-dev libmnl-dev libnftnl-dev libssl-dev \
            libgtk-3-dev libnotify-dev libayatana-appindicator3-dev librsvg2-dev \
            protobuf-compiler libprotobuf-dev rpm ruby-full
          timeout 300 sudo gem install fpm --no-document || echo "fpm via gem failed (electron-builder may still work)"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build Linux packages
        run: ./build.sh --optimize
        env:
          SOURCE_DATE_EPOCH: "1735689600"
          PROTOC_INCLUDE: /usr/include
      - name: List artifacts
        if: always()
        run: ls -la dist/ || true
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: SocialCommandVPN-linux-2026.7
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
